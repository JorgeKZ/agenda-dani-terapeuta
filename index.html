<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dani Santos - Terapeuta Holística</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --bg-dark: #0f0c20;
            --card-bg: rgba(25, 20, 45, 0.88);
            --text-light: #f8f9fa;
            --text-muted: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.12) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        .app-card {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            margin-bottom: 25px;
        }

        .header-title-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 10px;
        }

        .header-symbol {
            width: 65px;
            height: 65px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.5));
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--gold-light);
            letter-spacing: 3px;
            text-align: center;
            flex-grow: 1;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-align: center;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 25px 0;
            opacity: 0.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: 600;
        }

        select, input[type="date"], input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 12, 32, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        select:focus, input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .date-time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .date-time-grid {
                grid-template-columns: 1fr;
            }
            .header-symbol {
                width: 45px;
                height: 45px;
            }
            header h1 {
                font-size: 1.6rem;
            }
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .time-btn {
            background: rgba(15, 12, 32, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--text-light);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }

        .time-btn.active {
            background: var(--gold);
            color: #000;
            font-weight: bold;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
            color: #000;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        /* Mensagem de Sucesso */
        .success-box {
            display: none;
            text-align: center;
            padding: 20px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 16px;
            margin-top: 20px;
        }

        .success-box h3 {
            color: #4ade80;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .success-box p {
            font-size: 0.95rem;
            color: var(--text-light);
        }

        /* Rodapé Restrito */
        .admin-trigger {
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .admin-trigger:hover {
            opacity: 1;
            color: var(--gold);
        }

        /* Área de Agendamentos (Oculta) */
        .dashboard-section {
            display: none;
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 24px;
            padding: 30px;
            margin-top: 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .dashboard-header h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.3rem;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            background: rgba(15, 12, 32, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--text-light);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .filter-btn.active {
            background: var(--gold);
            color: #000;
            font-weight: bold;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .appointment-card {
            background: rgba(15, 12, 32, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 14px;
            padding: 16px;
        }

        .appointment-card h3 {
            color: var(--gold);
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .appointment-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="app-card">
        <header>
            <div class="header-title-container">
                <!-- Símbolo / Escudo do Arcanjo Miguel (Esquerda) -->
                <svg class="header-symbol" viewBox="0 0 200 200" fill="none" stroke="#d4af37" stroke-width="2.5">
                    <circle cx="100" cy="100" r="90" stroke-width="2"/>
                    <circle cx="100" cy="100" r="75" stroke-width="1.5"/>
                    <!-- Pentagrama do Arcanjo -->
                    <polygon points="100,28 121,88 184,88 133,125 152,185 100,148 48,185 67,125 16,88 79,88" stroke-width="1.5" fill="none"/>
                    <!-- Espada Central da Proteção -->
                    <path d="M100,15 L100,165" stroke-width="3"/>
                    <path d="M85,50 L115,50" stroke-width="3"/>
                    <circle cx="100" cy="172" r="5" fill="#d4af37"/>
                </svg>

                <h1>Dani Santos</h1>

                <!-- Símbolo / Escudo do Arcanjo Miguel (Direita) -->
                <svg class="header-symbol" viewBox="0 0 200 200" fill="none" stroke="#d4af37" stroke-width="2.5">
                    <circle cx="100" cy="100" r="90" stroke-width="2"/>
                    <circle cx="100" cy="100" r="75" stroke-width="1.5"/>
                    <!-- Pentagrama do Arcanjo -->
                    <polygon points="100,28 121,88 184,88 133,125 152,185 100,148 48,185 67,125 16,88 79,88" stroke-width="1.5" fill="none"/>
                    <!-- Espada Central da Proteção -->
                    <path d="M100,15 L100,165" stroke-width="3"/>
                    <path d="M85,50 L115,50" stroke-width="3"/>
                    <circle cx="100" cy="172" r="5" fill="#d4af37"/>
                </svg>
            </div>
            <p>Terapeuta Holística • Agendamento Online</p>
        </header>

        <div class="divider"></div>

        <form id="bookingForm">
            <div class="form-group">
                <label for="service">Selecione o Serviço</label>
                <select id="service" onchange="handleServiceChange()" required>
                    <option value="" disabled selected>Escolha o atendimento...</option>
                    <option value="Massagem Energética">Massagem Energética</option>
                    <option value="Reiki & Alinhamento dos Chakras">Reiki & Alinhamento dos Chakras</option>
                    <option value="Tarô">Tarô</option>
                    <option value="Mesa Radiônica">Mesa Radiônica</option>
                    <option value="Esteira de Ervas">Esteira de Ervas</option>
                    <option value="Limpeza de Final de Ano">Limpeza de Final de Ano</option>
                    <option value="Encontro Sagrado Feminino">Encontro Sagrado Feminino</option>
                </select>
            </div>

            <div class="date-time-grid" id="dateTimeSection">
                <div class="form-group">
                    <label for="date">Selecione a Data</label>
                    <input type="date" id="date">
                </div>

                <div class="form-group">
                    <label>Horários</label>
                    <div class="time-slots" id="timeSlots">
                        <div class="time-btn" onclick="selectTime(this, '08:00')">08:00</div>
                        <div class="time-btn" onclick="selectTime(this, '10:00')">10:00</div>
                        <div class="time-btn" onclick="selectTime(this, '12:00')">12:00</div>
                        <div class="time-btn" onclick="selectTime(this, '14:00')">14:00</div>
                        <div class="time-btn" onclick="selectTime(this, '16:00')">16:00</div>
                        <div class="time-btn" onclick="selectTime(this, '18:00')">18:00</div>
                        <div class="time-btn" onclick="selectTime(this, '20:00')">20:00</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="name">Seu Nome Completo</label>
                <input type="text" id="name" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="phone">Celular / WhatsApp</label>
                <input type="tel" id="phone" placeholder="(00) 00000-0000" required>
            </div>

            <button type="button" class="btn-submit" id="submitBtn" onclick="processBooking()">Confirmar Agendamento</button>
        </form>

        <div class="success-box" id="successBox">
            <h3>✨ Agendamento Confirmado!</h3>
            <p id="successMsg">Seus dados foram enviados com sucesso para a terapeuta Dani Santos.</p>
        </div>
    </div>

    <div class="admin-trigger" onclick="accessAdmin()">Área da Terapeuta 🔒</div>

    <div class="dashboard-section" id="adminDashboard">
        <div class="dashboard-header">
            <h2>Painel da Terapeuta</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setFilter('day', this)">Dia</button>
                <button class="filter-btn" onclick="setFilter('week', this)">Semana</button>
                <button class="filter-btn" onclick="setFilter('month', this)">Mês</button>
            </div>
        </div>

        <div class="cards-grid" id="appointmentsGrid"></div>
    </div>

    <script>
        let selectedTimeValue = '';
        let currentFilter = 'day';
        let appointments = JSON.parse(localStorage.getItem('dani_appointments')) || [];

        function selectTime(element, time) {
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedTimeValue = time;
        }

        function handleServiceChange() {
            const service = document.getElementById('service').value;
            const dateTimeSection = document.getElementById('dateTimeSection');
            const submitBtn = document.getElementById('submitBtn');

            if (service === 'Encontro Sagrado Feminino') {
                dateTimeSection.style.display = 'none';
                submitBtn.innerText = 'Inscrever-se no Encontro';
            } else {
                dateTimeSection.style.display = 'grid';
                submitBtn.innerText = 'Confirmar Agendamento';
            }
        }

        function processBooking() {
            const service = document.getElementById('service').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const date = document.getElementById('date').value;

            if (!service || !name || !phone) {
                alert('Por favor, preencha todos os campos obrigatórios!');
                return;
            }

            const isEvent = service === 'Encontro Sagrado Feminino';

            if (!isEvent && (!date || !selectedTimeValue)) {
                alert('Por favor, selecione a data e o horário!');
                return;
            }

            // Salva internamente no banco de dados local da aplicação
            const newAppointment = {
                id: Date.now(),
                service,
                name,
                phone,
                date: isEvent ? new Date().toISOString().split('T')[0] : date,
                time: isEvent ? 'Evento Especial' : selectedTimeValue
            };

            appointments.push(newAppointment);
            localStorage.setItem('dani_appointments', JSON.stringify(appointments));

            // Exibe aviso de confirmação na tela sem redirecionar
            document.getElementById('bookingForm').style.display = 'none';
            const successBox = document.getElementById('successBox');
            successBox.style.display = 'block';

            const formattedDate = isEvent ? 'A combinar' : date.split('-').reverse().join('/');
            document.getElementById('successMsg').innerHTML = 
                `Obrigado(a), <strong>${name}</strong>!<br>Seu agendamento para <strong>${service}</strong> em <strong>${formattedDate}</strong> às <strong>${isEvent ? 'Horário a definir' : selectedTimeValue}</strong> foi registrado com sucesso.`;
        }

        function accessAdmin() {
            const password = prompt("Digite a senha de acesso da Terapeuta:");
            if (password === "dani123") {
                document.getElementById('adminDashboard').style.display = 'block';
                renderAppointments();
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else if (password !== null) {
                alert("Senha incorreta!");
            }
        }

        function setFilter(filter, element) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            renderAppointments();
        }

        function renderAppointments() {
            const grid = document.getElementById('appointmentsGrid');
            grid.innerHTML = '';

            if (appointments.length === 0) {
                grid.innerHTML = '<div class="no-data">Nenhum agendamento registrado no momento.</div>';
                return;
            }

            appointments.forEach(app => {
                const card = document.createElement('div');
                card.className = 'appointment-card';
                const dateDisplay = app.date ? app.date.split('-').reverse().join('/') : '-';
                
                card.innerHTML = `
                    <h3>${app.service}</h3>
                    <p>👤 <strong>${app.name}</strong></p>
                    <p>📱 ${app.phone}</p>
                    <p>📅 ${dateDisplay}</p>
                    <p>⏰ ${app.time}</p>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
